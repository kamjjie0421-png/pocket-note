<!doctype html>
<html lang="ko" data-src="dashboard.enc.json">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pocket Note">
<meta name="theme-color" content="#23675F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Pocket Note</title>
<style>
/* 공개 껍데기 — 내용은 전부 암호문(*.enc.json). 비밀번호로 이 기기 브라우저 안에서만 푼다 */
:root{--bg:#F4F5F3;--surface:#fff;--ink:#1C2220;--muted:#66706C;--line:#DCE1DE;--accent:#23675F;--warn:#A6620F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121715;--surface:#1A201E;--ink:#E3E9E6;--muted:#98A39F;--line:#2C3532;--accent:#73BBB1;--warn:#E3A857}}
:root[data-theme="dark"]{--bg:#121715;--surface:#1A201E;--ink:#E3E9E6;--muted:#98A39F;--line:#2C3532;--accent:#73BBB1;--warn:#E3A857}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.lock{max-width:340px;margin:22vh auto 0;padding:0 16px;text-align:center}
.logo{width:56px;height:56px;border-radius:16px;background:var(--accent);margin:0 auto 14px}
h1{font-size:18px;margin:0}
p{font-size:13px;color:var(--muted);margin:6px 0 0}
input{width:100%;font-size:16px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);margin:18px 0 8px;outline:none}
input:focus{border-color:var(--accent)}
button{width:100%;padding:13px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;font-size:15px}
.err{color:var(--warn);font-size:13px;min-height:20px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="lock" id="lock" hidden>
  <div class="logo"></div>
  <h1>Pocket Note</h1>
  <p>비밀번호를 넣으면 이 기기에서만 열립니다</p>
  <form id="f"><input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호"><div class="err" id="err"></div><button type="submit">열기</button></form>
</div>
<script>
(async () => {
  const SRC = document.documentElement.dataset.src || "app.enc.json";   // dashboard.html 은 dashboard.enc.json
  const KEY = "pocketnote.pw.v1", $ = s => document.querySelector(s);
  const st = {get(){try{return localStorage.getItem(KEY)}catch(e){return null}}, set(v){try{localStorage.setItem(KEY,v)}catch(e){}}, del(){try{localStorage.removeItem(KEY)}catch(e){}}};
  if (location.hash === "#forget") { st.del(); history.replaceState(null, "", location.pathname); }   // 이 기기 비밀번호 지우기
  async function decrypt(enc, pw){
    const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b(enc.salt), iterations:enc.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:b(enc.iv)}, key, b(enc.ct)));
  }
  const open = html => { document.open(); document.write(html); document.close(); };
  let enc;
  try { enc = await (await fetch(SRC, {cache: "no-store"})).json(); }
  catch (e) { $("#lock").hidden = false; $("#err").textContent = "아직 내용이 올라오지 않았습니다"; return; }
  const saved = st.get();
  if (saved) { try { return open(await decrypt(enc, saved)); } catch (e) { st.del(); } }
  $("#lock").hidden = false; $("#pw").focus();
  $("#f").onsubmit = async ev => {
    ev.preventDefault(); $("#err").textContent = "";
    try { const pw = $("#pw").value; const html = await decrypt(enc, pw); st.set(pw); open(html); }
    catch (e) { $("#err").textContent = "비밀번호가 맞지 않습니다"; }
  };
})();
</script>
</body>
</html>
